
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soniclab"
version = "0.1.0"
description = "A lightweight desktop multitrack audio editor"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "scipy>=1.12",
    "pyqtgraph>=0.13.7",
    "aubio>=0.4.9",
]

# Optional. The code is BSD-2-Clause. The pretrained weights it downloads
# are CC BY-NC-SA 4.0 and are not a dependency of this package. Do not treat
# this extra as commercial clearance for those weights.
[project.optional-dependencies]
beats = [
    "madmom-infer @ git+https://github.com/openmirlab/madmom-infer.git@bffead9be61857fd44b2e0d3a2510d9d94c8f2d2",
]

[project.scripts]
soniclab = "soniclab.main:main"

[tool.setuptools.packages.find]
include = ["soniclab*"]

